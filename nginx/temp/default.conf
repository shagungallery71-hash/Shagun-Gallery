server {
    listen 80;
    listen [::]:80;

    server_name shagungallery.com www.shagungallery.com;

    # ACME challenge path for Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Temporary response to confirm HTTP is working
    location / {
        default_type text/plain;
        return 200 "Temporary HTTP server for SSL verification\n";
    }
}

