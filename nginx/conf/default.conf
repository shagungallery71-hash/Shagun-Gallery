server {
    listen 80;
    server_name shagungallery.com www.shagungallery.com;

    # Allow large file uploads
    client_max_body_size 100M;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name shagungallery.com www.shagungallery.com;

    ssl_certificate /etc/letsencrypt/live/shagungallery.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shagungallery.com/privkey.pem;

    # Allow large file uploads (100MB)
    client_max_body_size 100M;

    #frontend location proxy
    location / {
        proxy_pass http://shagung_frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Prevent caching of HTML pages (mobile carriers/browsers cache aggressively)
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
    }

    #backend location proxy
    location /api/ {
        proxy_pass http://shagung_backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Allow larger file uploads specifically for API
        client_max_body_size 100M;
        
        # Increase timeouts for large uploads
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        
        # Buffer settings for large requests
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }
}


